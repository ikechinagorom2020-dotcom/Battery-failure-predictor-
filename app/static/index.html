<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Battery Failure Predictor</title>
<style>
  :root {
    --blue: #2563eb;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  fieldset {
    border: none;
    padding: 0;
    margin: 0 0 20px 0;
  }
  legend {
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  form { display: block; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .field { display: flex; flex-direction: column; }
  label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93a4c3; cursor: not-allowed; }
  #result {
    margin-top: 20px;
    padding: 16px 18px;
    border-radius: 10px;
    display: none;
    font-size: 15px;
  }
  #result.fail { background: #fee2e2; color: #991b1b; }
  #result.ok { background: #dcfce7; color: #166534; }
  #result b { display: block; font-size: 17px; margin-bottom: 4px; }
  #loading { display: none; color: var(--muted); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔋 Battery Failure Predictor</h1>
  <p class="sub">Enter the vehicle and battery telemetry values below, then run a prediction.</p>

  <div class="card">
    <form id="predictForm">
      <fieldset>
        <legend>Numeric features</legend>
        <div class="grid" id="numFields"></div>
      </fieldset>
      <fieldset>
        <legend>Categorical features</legend>
        <div class="grid" id="catFields"></div>
      </fieldset>
      <button type="submit" id="submitBtn">Predict Failure Risk</button>
      <div id="loading">Running prediction…</div>
    </form>
    <div id="result"></div>
  </div>
</div>

<script>
  const numFieldsDiv = document.getElementById("numFields");
  const catFieldsDiv = document.getElementById("catFields");
  const form = document.getElementById("predictForm");
  const resultDiv = document.getElementById("result");
  const loadingDiv = document.getElementById("loading");
  const submitBtn = document.getElementById("submitBtn");

  async function buildForm() {
    const res = await fetch("/features");
    const data = await res.json();

    data.num_cols.forEach((col) => {
      const field = document.createElement("div");
      field.className = "field";
      field.innerHTML = `<label>${col}</label><input type="number" step="any" name="${col}" required>`;
      numFieldsDiv.appendChild(field);
    });

    data.cat_cols.forEach((col) => {
      const field = document.createElement("div");
      field.className = "field";
      const options = data.categories[col]
        .map((c) => `<option value="${c}">${c}</option>`)
        .join("");
      field.innerHTML = `<label>${col}</label><select name="${col}">${options}</select>`;
      catFieldsDiv.appendChild(field);
    });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {};
    new FormData(form).forEach((value, key) => {
      const num = parseFloat(value);
      payload[key] = value !== "" && !isNaN(num) ? num : value;
    });

    submitBtn.disabled = true;
    loadingDiv.style.display = "block";
    resultDiv.style.display = "none";

    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: payload }),
      });
      const out = await res.json();

      resultDiv.style.display = "block";
      if (out.prediction === 1) {
        resultDiv.className = "fail";
        resultDiv.innerHTML = `<b>⚠️ Failure Risk Detected</b>Probability: ${(out.failure_probability * 100).toFixed(2)}% &nbsp;|&nbsp; Threshold: ${out.threshold_used}`;
      } else {
        resultDiv.className = "ok";
        resultDiv.innerHTML = `<b>✅ No Failure Predicted</b>Probability: ${(out.failure_probability * 100).toFixed(2)}% &nbsp;|&nbsp; Threshold: ${out.threshold_used}`;
      }
    } catch (err) {
      resultDiv.style.display = "block";
      resultDiv.className = "fail";
      resultDiv.innerHTML = `<b>Error</b>${err}`;
    } finally {
      submitBtn.disabled = false;
      loadingDiv.style.display = "none";
    }
  });

  buildForm();
</script>
</body>
</html>
